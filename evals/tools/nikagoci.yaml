tool: encrypt_vigenere

cases:
  - name: basic_attack_at_dawn
    arguments:
      text: "attackatdawn"
      key: "lemon"
    expect:
      ciphertext: "lxfopvefrnhr"

  - name: mixed_case_and_punctuation
    arguments:
      text: "Attack at dawn!"
      key: "lemon"
    expect:
      ciphertext: "Lxfopv ef rnhr!"

  - name: uppercase_key_is_lowercased
    arguments:
      text: "hello"
      key: "LEMON"
    expect:
      ciphertext: "sixzb"

  - name: bad_input_empty_key
    arguments:
      text: "hello"
      key: ""
    expect_error: "invalid input"

  - name: adversarial_repeat_call_idempotent
    arguments:
      text: "hello"
      key: "lemon"
    expect:
      ciphertext: "sixzb"
