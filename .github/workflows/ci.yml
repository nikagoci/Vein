name: tests

on:
  push:
  pull_request:

jobs:
  pytest:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install test and tool dependencies
        run: python -m pip install --upgrade pip pytest pyyaml "pydantic>=2,<3" "mcp>=2.3,<3"
      - name: Run tests
        run: python -m pytest -q
